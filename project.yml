# XcodeGen 專案定義：在 CI（macOS）上執行 `xcodegen generate` 產生 MyIME.xcodeproj
# 注意：Bundle ID 與 App Group ID 一旦開始側載就不要再改（風險 R13、R14）
name: MyIME

options:
  bundleIdPrefix: com.watanyukan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
    DEVELOPMENT_TEAM: ""

packages:
  IMECore:
    path: Packages/IMECore   # 純 Swift 輸入引擎，App 與鍵盤擴充共用

targets:
  MyIME:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    scheme: {}
    entitlements:
      path: App/MyIME.entitlements
      # XcodeGen 會依 properties 重新產生此檔；不寫 properties 會被覆寫成空的
      properties:
        com.apple.security.application-groups:
          - group.com.watanyukan.myime
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MyIME
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watanyukan.myime
    dependencies:
      - target: MyIMEKeyboard   # app-extension 會自動嵌入 PlugIns/
      - package: IMECore

  # 截圖測試（Issue #32）：在模擬器裡把鍵盤元件畫成 PNG，不需要 host App
  MyIMEKeyboardSnapshots:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: KeyboardExtension
        excludes:
          - KeyboardViewController.swift
      - Shared
      - Tests/SnapshotTests
    dependencies:
      - package: IMECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watanyukan.myime.snapshots
        GENERATE_INFOPLIST_FILE: YES

  MyIMEKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - KeyboardExtension
      - Shared
    entitlements:
      path: KeyboardExtension/MyIMEKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.watanyukan.myime
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: MyIME
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: zh-Hant
            RequestsOpenAccess: true   # 完整取用：共用容器、剪貼簿需要
    dependencies:
      - package: IMECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.watanyukan.myime.keyboard
