name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 碼表防護（R-LIU-1）：repo 中除虛構測試碼表外不得有任何 .cin
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block code tables
        run: |
          bad=$(git ls-files | grep -iE '\.cin$' | grep -v '^Packages/IMECore/Tests/IMECoreTests/Fixtures/sample\.cin$' || true)
          if [ -n "$bad" ]; then
            echo "::error::repo 中不得包含碼表檔："
            echo "$bad"
            exit 1
          fi
          echo "OK：沒有碼表檔"

  # 輸入引擎單元測試（NFR-10）：純 Swift，在 Linux 上跑，快且不佔 macOS runner
  imecore:
    needs: guard
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test IMECore
        run: swift test --package-path Packages/IMECore --parallel --enable-code-coverage

      # 覆蓋率目前只顯示、不擋 CI（Gate 2 目標 ≥ 80%）；看過實際數字後再決定是否設門檻
      - name: Coverage summary
        continue-on-error: true
        run: |
          PKG=Packages/IMECore
          PROFDATA=$(find "$PKG/.build" -name default.profdata | head -1)
          BIN=$(find "$PKG/.build" -name 'IMECorePackageTests.xctest' -type f | head -1)
          llvm-cov report "$BIN" -instr-profile="$PROFDATA" -ignore-filename-regex='(\.build|Tests)/' | tee coverage.txt
          {
            echo '### IMECore 測試覆蓋率'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 鍵盤外觀截圖（Issue #32）：模擬器跑截圖測試，圖片上傳為 Artifact 供檢視
  snapshots:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run snapshot tests
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("iPhone"))][0].udid')
          echo "Simulator: $DEVICE"
          mkdir -p "$PWD/snapshots"
          TEST_RUNNER_SNAPSHOT_DIR="$PWD/snapshots" xcodebuild test \
            -project MyIME.xcodeproj \
            -scheme MyIMEKeyboardSnapshots \
            -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tail -60
          ls -la snapshots

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-snapshots-${{ github.run_number }}
          path: snapshots
          retention-days: 14

  ios:
    needs: guard
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      # Gate 2：引擎測試也要在 macOS 通過。Big5 解碼等 Apple 平台專屬程式只有這裡會編譯與執行
      - name: Test IMECore on macOS
        run: swift test --package-path Packages/IMECore --parallel

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MyIME.xcodeproj \
            -scheme MyIME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: bash Tools/package_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MyIME-ipa-${{ github.run_number }}
          path: dist/MyIME.ipa
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MyIME-ipa-${{ github.run_number }}
      - uses: softprops/action-gh-release@v2
        with:
          files: MyIME.ipa
